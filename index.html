<!doctype html>
<html lang="ru">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#101522">
 <meta name="description" content="План продаж на 30 дней, рабочие задания, воронка и выручка.">
 <title>Мандала · Рабочий месяц</title>
 <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
 <link rel="stylesheet" href="styles.css">
</head>
<body>
 <aside class="sidebar">
  <a href="#" class="brand" aria-label="Мандала — главная"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Мандала</a>
  <nav aria-label="Основная навигация">
   <div class="nav-group">
    <span class="nav-label">Работа</span>
    <button class="nav active" data-view="today"><span aria-hidden="true">▦</span>Месяц</button>
    <button class="nav" data-view="pipeline"><span aria-hidden="true">≡</span>Воронка</button>
    <button class="nav" data-view="analytics"><span aria-hidden="true">▥</span>Динамика</button>
    <button class="nav" data-view="reports"><span aria-hidden="true">↧</span>Отчёты</button>
   </div>
   <div class="nav-group secondary-nav">
    <span class="nav-label">Стратегия</span>
    <button class="nav" data-view="matrix"><span aria-hidden="true">◇</span>Матрица</button>
    <button class="nav" data-view="actions"><span aria-hidden="true">✓</span>Действия</button>
    <button class="nav" data-view="focus"><span aria-hidden="true">◎</span>Фокус</button>
    <button class="nav" data-view="reviews"><span aria-hidden="true">◷</span>Рефлексия</button>
   </div>
  </nav>
  <div class="sidebar-bottom"><button class="nav" data-act="settings"><span aria-hidden="true">⚙︎</span>Данные и облако</button></div>
 </aside>
 <main>
  <header class="topbar">
   <span id="breadcrumb">Рабочий месяц</span>
   <div class="top-actions">
    <span id="save-state" role="status"><i></i>Сохранено на устройстве</span>
    <button class="icon-btn" data-act="settings" aria-label="Данные и облако">⚙︎</button>
    <button class="btn small" data-act="export">Резервная копия</button>
   </div>
  </header>
  <div class="page">
   <section class="page-heading"><div><h1 id="page-title">Рабочий месяц</h1><p id="page-description"></p></div><button class="btn" data-act="goal">Настроить цель</button></section>
   <section class="goal-banner"><div class="goal-symbol">◎</div><div class="goal-copy"><h2 id="goal-title"></h2><p id="goal-subtitle"></p></div><div class="goal-deadline"><span class="eyebrow">Горизонт</span><strong id="goal-date"></strong><small id="days-left"></small></div><button class="icon-btn" data-act="goal" aria-label="Редактировать главную цель">→</button></section>
   <section class="metrics" aria-label="Прогресс матрицы">
    <div><span>Пройдено шагов</span><strong id="done-count">0 <small>/ 64</small></strong><div class="progress-track"><i id="total-bar"></i></div></div>
    <div><span>В работе</span><strong id="doing-count">0</strong></div>
    <div><span>Фокус недели</span><strong id="focus-count">0 <small>/ 3</small></strong></div>
    <button data-act="goal" class="metric-button"><span>Доход от сервисов / мес.</span><strong id="income">Задать цель →</strong><small id="income-note"></small></button>
   </section>
   <div id="view-content"></div>
   <footer><a href="SETUP.html">Запуск и сохранение</a><button class="text-btn" data-act="print">Печать матрицы →</button></footer>
  </div>
 </main>
 <dialog id="editor" aria-labelledby="dialog-title"><div class="dialog-head"><span class="eyebrow" id="dialog-kicker"></span><button class="icon-btn" data-act="close" aria-label="Закрыть">×</button></div><div id="dialog-content"></div></dialog>
 <div id="toast" role="status" aria-live="polite"></div>
 <input type="file" id="import-file" accept="application/json,.json" hidden>
 <input type="file" id="month-file" accept="application/json,.json" hidden>
 <script src="seed.js"></script><script src="daily.js"></script><script src="plan-data.js"></script><script src="plan.js"></script><script src="core.js"></script><script src="app.js"></script>
</body>
</html>
